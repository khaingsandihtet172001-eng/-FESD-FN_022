<div class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
    <div>
      <h1 class="h3 mb-1">Registered Users</h1>
      <p class="text-secondary mb-0">User list with calculated age</p>
    </div>
    <a routerLink="/register" class="btn btn-primary">+ New Registration</a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>Full Name</th>
              <th>Email</th>
              <th>Telephone</th>
              <th>Date of Birth</th>
              <th>Age</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of users; let i = index">
              <td>{{ i + 1 }}</td>
              <td class="fw-semibold">{{ user.userFirstName }} {{ user.userLastName }}</td>
              <td>{{ user.userEmail }}</td>
              <td>{{ user.userTel }}</td>
              <td>{{ user.dateOfBirth }}</td>
              <td><span class="badge text-bg-primary">{{ user.getAge() }}</span></td>
            </tr>
            <tr *ngIf="users.length === 0">
              <td colspan="6" class="text-center py-4 text-secondary">No users registered.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
